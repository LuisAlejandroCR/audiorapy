# ci.yml: the verify gate (typecheck, lint, format, unit/fuzz/invariant tests, build, API smoke) and the
# Playwright end-to-end suite and the Postgres integration job, on every PR and push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Fuzz tests
        run: npm run test:fuzz
      - name: Invariant tests
        run: npm run test:invariant
      - run: npm run build
      - name: Intent eval (rules baseline must not regress)
        run: npm run eval:intent -- --min-accuracy 0.9
      - name: Smoke test the real API process
        run: npm run smoke:api
      - name: Kill the providers (each external service unreachable)
        run: npm run demo:degraded
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (built dashboard + real API process)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audiorapy
          POSTGRES_PASSWORD: audiorapy
          POSTGRES_DB: audiorapy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audiorapy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://audiorapy:audiorapy@127.0.0.1:5432/audiorapy_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Store contract against a real Postgres 16
        run: npm run test:integration
      - name: Smoke test with Postgres (bookings survive a restart)
        run: npm run smoke:api
