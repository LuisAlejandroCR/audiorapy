# pyproject.toml: the no-show risk sidecar. TabPFN is an optional extra: it pulls PyTorch and downloads
# its weights from Hugging Face on first use; without it the sidecar serves the logistic baseline.
[project]
name = "audiorapy-risk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "scikit-learn>=1.5",
  "numpy>=2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
# TabPFN 9.x defaults to v3.5 weights (non-commercial); the code always asks for ModelVersion.V2 (Apache-2.0).
tabpfn = ["tabpfn==9.1.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
