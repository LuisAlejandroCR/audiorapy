# render.yaml: Render Blueprint — the API (Node web service), the therapist dashboard (static site) and
# Render Postgres for the scheduling store. Secrets are never written here: `sync: false` values are
# entered in the Render dashboard; DASHBOARD_TOKEN is generated. Not yet validated by a Render deploy.

databases:
  - name: audiorapy-db
    databaseName: audiorapy
    user: audiorapy
    postgresMajorVersion: '16'
    # Reachable only from services on Render's private network.
    ipAllowList: []

services:
  - type: web
    name: audiorapy-api
    runtime: node
    plan: starter # the free plan sleeps after 15 min idle and makes Meta retry webhooks
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: audiorapy-db
          property: connectionString
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: DASHBOARD_ORIGIN
        sync: false # the dashboard's URL, e.g. https://audiorapy-web.onrender.com
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: AI_INTENT_PROVIDER
        value: rules # switch to `ollama` only with OLLAMA_BASE_URL behind an authenticated tunnel
      - key: OLLAMA_BASE_URL
        sync: false
      - key: RISK_PROVIDER
        value: sidecar # falls back to the heuristic whenever the sidecar does not answer within 3 s
      - key: RISK_URL
        fromService:
          type: pserv
          name: audiorapy-risk
          property: hostport
      - key: PRACTICE_NAME
        sync: false
      - key: PRIVACY_URL
        sync: false

  # No-show risk sidecar (services/risk): private service, reachable only from the API. Trains on
  # synthetic data at startup and serves the logistic baseline; TabPFN-2 needs `pip install '.[tabpfn]'`
  # and RISK_MODEL=tabpfn-v2, which pulls PyTorch and is left off here.
  - type: pserv
    name: audiorapy-risk
    runtime: python
    plan: starter
    rootDir: services/risk
    buildCommand: pip install .
    startCommand: uvicorn --factory risk.app:build_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RISK_MODEL
        value: logistic
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: audiorapy-web
    runtime: static
    buildCommand: npm ci && npm run build -w @audiorapy/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_ORIGIN
        sync: false # the API's URL, e.g. https://audiorapy-api.onrender.com — added to the page's CSP
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
